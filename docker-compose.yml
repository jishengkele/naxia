x-logging: &container-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *container-logging
    # 2C2G 小机器的内存口径：PostgreSQL 官方镜像会按宿主机内存自动放大缓存，
    # 在小机器上容易和 app、浏览器/工具子进程抢内存。这里固定成安全值
    # （shared_buffers 192MB / max_connections 60 / effective_cache_size 512MB）。
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=60
      - -c
      - effective_cache_size=512MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: ${ARTEX_IMAGE:-ghcr.io/jishengkele/naxia}:${ARTEX_TAG:-latest}
    logging: *container-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ARTEX_ARCHIVE_DIR: /app/task-archives
      # 日志与任务时间按本地时区输出（可在 .env 用 TZ 覆盖）。
      TZ: ${TZ:-Asia/Shanghai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      # 只绑回环：对外一律走反向代理（Nginx/Caddy）终结 TLS。这样即使没配反代，
      # API/SSE/流量代理也不会直接暴露在公网。需要直连时改成 "8787:8787"。
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
      - ${ARTEX_ARCHIVE_HOST_DIR:-/root/naxia-archives}:/app/task-archives
    restart: unless-stopped

volumes:
  pgdata:
