# NAXIA 反向代理参考配置（Nginx）
#
# 用法：
#   1) 把下面的 naxia.example.com 换成你的域名；
#   2) 放到 /etc/nginx/sites-available/naxia 并 ln -s 到 sites-enabled/；
#   3) nginx -t && systemctl reload nginx；
#   4) 签证书：certbot --nginx -d 你的域名（会自动补 443 与 80→443 跳转）。
#
# 前置：docker-compose.yml 默认把 8787/8788 绑在 127.0.0.1，只有反代能访问它们。
# 8788 是流量录制 MITM 代理，永远不要在这里反代它。

server {
    listen 80;
    listen [::]:80;
    server_name naxia.example.com;

    # 工作空间上传 / 任务归档包
    client_max_body_size 200m;

    # 静态导出的 `/` 是 Next 的 redirect()，导出后变成错误页；这里兜到登录页
    # （登录页会按初始化状态自动跳 /setup）。
    location = / {
        return 302 /login;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # SSE（activity / logs 实时流）必须关缓冲：开着会表现为"连上了但一直转圈"。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
